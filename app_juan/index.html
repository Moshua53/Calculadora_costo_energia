<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora de Energía (Tarifa fija)</title>
  <meta name="description" content="Calcula gasto mensual de energía y equivalencias por porcentaje de factura." />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="title">
        <h1>Calculadora de energía</h1>
        <p>Tarifa fija. Estimación mensual.</p>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="glass-card" role="region" aria-label="Calculadora">
      <section class="calc-section" aria-label="Gasto mensual">
        <div class="section-head">
          <h2>Gasto mensual</h2>
          <p class="hint">Ingresa tu consumo mensual para estimar el costo total.</p>
        </div>

        <div class="input-group">
          <label for="monthlyKwh">Consumo mensual</label>
          <div class="input-wrapper">
            <span class="icon" aria-hidden="true">kWh</span>
            <input type="text" id="monthlyKwh" placeholder="0" inputmode="decimal" autocomplete="off" />
          </div>
        </div>

        <div class="result-card main-result" aria-live="polite">
          <span class="label">Total estimado</span>
          <span class="value" id="monthlyTotal">$0.00</span>
        </div>
      </section>
    </div>

    <p class="footer-note">Los resultados son aproximados y dependen de tu factura y proveedor.</p>
  </main>

  <script src="script.js"></script>
</body>

</html>
